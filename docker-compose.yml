services:
  philomath.db.local:
    image: postgres
    restart: always
    ports: 
      - '${DB_PORT}:5432'
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
  philomath.app.local:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@philomath.db.local:5432/${DB_DATABASE}
    depends_on:
          - philomath.db.local
